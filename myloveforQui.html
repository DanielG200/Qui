<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qui ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(ellipse at center, #24002e 0%, #100018 45%, #020005 100%);
    font-family: 'Dancing Script', cursive;
}

/* Background atmosphere */

.background-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: rgba(255, 20, 147, 0.08);
    filter: blur(100px);
    animation: backgroundPulse 5s ease-in-out infinite;
    pointer-events: none;
}

@keyframes backgroundPulse {
    0%, 100% {
        transform: scale(0.8);
        opacity: 0.4;
    }
    50% {
        transform: scale(1.2);
        opacity: 0.9;
    }
}

/* Main scene */

.scene {
    position: relative;
    width: min(90vw, 500px);
    aspect-ratio: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Expanding energy rings */

.energy-ring {
    position: absolute;
    width: 70%;
    height: 70%;
    border: 1px solid rgba(255, 80, 170, 0.5);
    border-radius: 50%;
    opacity: 0;
    animation: ringExpand 3.5s ease-out infinite;
}

.energy-ring:nth-child(2) {
    animation-delay: 1.15s;
}

.energy-ring:nth-child(3) {
    animation-delay: 2.3s;
}

@keyframes ringExpand {
    0% {
        transform: scale(0.7);
        opacity: 0.7;
    }
    100% {
        transform: scale(1.65);
        opacity: 0;
    }
}

/* Heart container */

.heart-container {
    position: relative;
    width: 72%;
    z-index: 2;
    filter:
        drop-shadow(0 0 12px rgba(255, 20, 147, 0.8))
        drop-shadow(0 0 35px rgba(255, 20, 147, 0.5));
}

/* Heart SVG */

.heart-svg {
    width: 100%;
    overflow: visible;
}

.heart-path {
    fill: url(#heartFill);
    stroke: url(#heartStroke);
    stroke-width: 1.4;
    stroke-linejoin: round;
    transform-box: fill-box;
    transform-origin: center;
    animation: heartbeat 1.35s infinite;
}

/* Double heartbeat */

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    8% {
        transform: scale(1.12);
    }

    16% {
        transform: scale(1);
    }

    25% {
        transform: scale(1.17);
    }

    38% {
        transform: scale(1);
    }

    55% {
        transform: scale(1.025);
    }

    70% {
        transform: scale(1);
    }
}

/* Name */

.name {
    position: absolute;
    top: 43%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;

    color: white;
    font-size: clamp(3rem, 11vw, 5.5rem);
    font-weight: 700;
    white-space: nowrap;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #ffb6d9,
        0 0 25px #ff69b4,
        0 0 45px #ff1493,
        0 0 75px #ff1493;

    animation: nameGlow 2.5s ease-in-out infinite;
}

@keyframes nameGlow {
    0%, 100% {
        text-shadow:
            0 0 5px white,
            0 0 12px #ffb6d9,
            0 0 25px #ff69b4,
            0 0 45px #ff1493;
    }

    50% {
        text-shadow:
            0 0 10px white,
            0 0 20px #ffc0e0,
            0 0 40px #ff69b4,
            0 0 65px #ff1493,
            0 0 90px #ff1493;
    }
}

/* Floating hearts */

.floating-heart {
    position: fixed;
    bottom: -40px;
    left: var(--left);
    font-size: var(--size);
    color: white;
    opacity: 0;
    pointer-events: none;
    z-index: 1;

    text-shadow:
        0 0 8px white,
        0 0 18px rgba(255, 255, 255, 0.8),
        0 0 30px rgba(255, 182, 193, 0.6);

    animation: floatUp var(--duration) linear var(--delay) infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg) scale(0.6);
        opacity: 0;
    }

    15% {
        opacity: 0.8;
    }

    50% {
        transform: translateY(-55vh) translateX(25px) rotate(25deg) scale(1);
        opacity: 0.7;
    }

    85% {
        opacity: 0.4;
    }

    100% {
        transform: translateY(-115vh) translateX(-25px) rotate(70deg) scale(1.3);
        opacity: 0;
    }
}

/* Sparkles */

.sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: white;
    box-shadow:
        0 0 8px white,
        0 0 16px #ff69b4;
    animation: sparkle 2.5s ease-in-out infinite;
}

@keyframes sparkle {
    0%, 100% {
        transform: scale(0);
        opacity: 0;
    }

    50% {
        transform: scale(1.5);
        opacity: 1;
    }
}

/* Responsive */

@media (max-width: 500px) {
    .scene {
        width: 95vw;
    }

    .heart-container {
        width: 78%;
    }

    .name {
        font-size: clamp(3rem, 14vw, 4.5rem);
    }
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="scene">

    <!-- Energy waves -->
    <div class="energy-ring"></div>
    <div class="energy-ring"></div>
    <div class="energy-ring"></div>

    <!-- Heart -->
    <div class="heart-container">

        <svg class="heart-svg" viewBox="0 0 100 90"
             xmlns="http://www.w3.org/2000/svg">

            <defs>

                <linearGradient id="heartStroke"
                    x1="0%" y1="0%" x2="100%" y2="100%">

                    <stop offset="0%" stop-color="#ff1493"/>
                    <stop offset="50%" stop-color="#ff69b4"/>
                    <stop offset="100%" stop-color="#ffc0cb"/>

                </linearGradient>

                <radialGradient id="heartFill"
                    cx="40%" cy="30%" r="75%">

                    <stop offset="0%" stop-color="#ffb6d9"/>
                    <stop offset="40%" stop-color="#ff4da6"/>
                    <stop offset="100%" stop-color="#a00065"/>

                </radialGradient>

            </defs>

            <path class="heart-path"
                d="
                M50 85
                C43 78 5 49 5 27
                C5 3 36 -3 50 20
                C64 -3 95 3 95 27
                C95 49 57 78 50 85
                Z
                "/>

        </svg>

    </div>

    <!-- Name -->
    <div class="name">Qui</div>

    <!-- Sparkles -->
    <div class="sparkle" style="top:20%;left:20%;animation-delay:0s"></div>
    <div class="sparkle" style="top:30%;right:20%;animation-delay:.5s"></div>
    <div class="sparkle" style="bottom:25%;left:25%;animation-delay:1s"></div>
    <div class="sparkle" style="bottom:20%;right:25%;animation-delay:1.5s"></div>
    <div class="sparkle" style="top:10%;left:50%;animation-delay:.8s"></div>
    <div class="sparkle" style="bottom:10%;left:50%;animation-delay:1.8s"></div>

</div>

<script>

// Generate floating hearts

const heartSymbols = ['♥', '♡', '❤'];

for (let i = 0; i < 25; i++) {

    const heart = document.createElement('div');

    heart.className = 'floating-heart';

    heart.textContent =
        heartSymbols[Math.floor(Math.random() * heartSymbols.length)];

    heart.style.setProperty('--left', Math.random() * 100 + 'vw');

    heart.style.setProperty('--size', (12 + Math.random() * 25) + 'px');

    heart.style.setProperty('--duration', (7 + Math.random() * 8) + 's');

    heart.style.setProperty('--delay', (Math.random() * 12) + 's');

    document.body.appendChild(heart);

}

</script>

</body>
</html>
